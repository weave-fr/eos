[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eos"
version = "0.1.0"
description = "EOS — the first intelligence of Weave"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "pyyaml",
    "transformers",
    "pytest",
]

[tool.setuptools.packages.find]
include = ["eos*"]
