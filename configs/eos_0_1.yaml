# EOS 0.1 — Initial Model Configuration

model:
  name: eos-0.1
  architecture: decoder-only-transformer

  parameters_target: 200000000

  context_length: 8192

  hidden_size: 768
  num_layers: 24

  num_attention_heads: 12
  num_key_value_heads: 4

  intermediate_size: 2048

  activation: swiglu
  normalization: rmsnorm
  positional_encoding: rope

  tie_word_embeddings: true
  dropout: 0.0

tokenizer:
  source: existing
  name_or_path: HuggingFaceTB/SmolLM3-3B

data:
  languages:
    - fr
    - en

  french_priority: true

  sources_must_be_legal: true

  synthetic_data: selective

  human_data: minimum_necessary

training:
  stages:
    - pretraining
    - instruction_tuning
    - preference_alignment

  reasoning: progressive

  reinforcement_learning: false

  mixed_precision: true

  resume_from_checkpoint: true

runtime:
  code_execution: false

  tools: true

  web_search: true

  calculator: true

  documents: true
